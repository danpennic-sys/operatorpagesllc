name: verify-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what was triggered
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Tag input: ${{ inputs.tag }}"
          echo "Ref: ${{ github.ref }}"

      - name: Basic success
        run: echo "Verification workflow is installed and running"
