services:
  go-api:
    build: ./services/go-api
    port: 3000
    environment:
      - GO_PORT=3000
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL}
      - NODE_SERVICE_URL=${NODE_SERVICE_URL}
    depends_on:
      - python-chatgpt

  python-chatgpt:
    build: ./services/python-chatgpt
    port: 5000
    environment:
      - PYTHON_PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  node-frontend:
    build: ./services/node-frontend
    port: 8080
    environment:
      - NODE_PORT=8080
      - GO_API_URL=${GO_API_URL}
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL}
    depends_on:
      - go-api
      - python-chatgpt
