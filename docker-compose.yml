version: '3.8'

services:
  go-api:
    build:
      context: ./services/go-api
    ports:
      - "3000:3000"
    environment:
      - GO_PORT=3000
      - PYTHON_SERVICE_URL=http://python-chatgpt:5000
      - NODE_SERVICE_URL=http://node-frontend:8080
    depends_on:
      - python-chatgpt
    networks:
      - operatorpages-network

  python-chatgpt:
    build:
      context: ./services/python-chatgpt
    ports:
      - "5000:5000"
    environment:
      - PYTHON_PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - operatorpages-network

  node-frontend:
    build:
      context: ./services/node-frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_PORT=8080
      - GO_API_URL=http://go-api:3000
      - PYTHON_SERVICE_URL=http://python-chatgpt:5000
    depends_on:
      - go-api
      - python-chatgpt
    networks:
      - operatorpages-network

networks:
  operatorpages-network:
    driver: bridge
